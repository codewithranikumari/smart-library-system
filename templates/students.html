<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="navbar">
        <h2>🎓 Registered Students</h2>
        <a href="/dashboard">Back to Dashboard</a>
    </div>

    <div class="container">

        <div class="panel">

            <h1>Students List</h1>

            <br>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Username</th>
                </tr>

                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.username }}</td>
                </tr>
                {% endfor %}

            </table>

            {% if students|length == 0 %}
            <p style="margin-top:20px;">No students registered yet.</p>
            {% endif %}

        </div>

    </div>

</body>
</html>
